version: 2

builds:
  - main: ./cmd/voxctl
    flags:
      - -trimpath
    binary: voxctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/slauger/voxctl/internal/version.Version={{.Version}}
      - -X github.com/slauger/voxctl/internal/version.Commit={{.Commit}}
      - -X github.com/slauger/voxctl/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# The GitHub release and its notes are created by semantic-release,
# GoReleaser only attaches the build artifacts.
release:
  mode: keep-existing

changelog:
  disable: true
